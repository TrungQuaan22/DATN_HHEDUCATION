          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Student account attempted to upload video
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

