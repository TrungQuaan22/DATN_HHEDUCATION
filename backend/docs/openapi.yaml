  /admin/assessments:
    get:
      tags:
        - Assessments
      summary: List admin assessments
      description: Admin and teacher list non-deleted assessments with pagination and optional filters.
      operationId: listAdminAssessments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: subject
          schema:
            $ref: '#/components/schemas/Subject'
        - in: query
          name: grade
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: gradingType
          schema:
            $ref: '#/components/schemas/GradingType'
        - in: query
          name: scope
          description: Filter assessment ownership surface. Teachers only receive assessments they created.
          schema:
            type: string
            enum:
              - all
              - public
              - course
              - unplaced
        - in: query
          name: courseId
          description: Required when scope is course. Limits results to assessments placed on the selected course or one of its lessons.
          schema:
            type: string
            format: uuid
        - in: query
          name: visibility
          schema:
            $ref: '#/components/schemas/AssessmentVisibility'
      responses:
        '200':
          description: Assessment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdminAssessmentsSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Assessments
      summary: Create assessment draft
      description: Creates a draft assessment. Exam assessments require a ready PDF source media before publish.
      operationId: createAssessment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
            example:
              title: De luyen tap toan 12
              subject: math
              grade: 12
              type: quiz
              gradingType: auto
              timeLimitMinutes: 90
              sourceMediaId: null
      responses:
        '201':
          description: Assessment draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssessmentSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

