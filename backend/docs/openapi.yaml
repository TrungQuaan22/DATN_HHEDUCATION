openapi: 3.0.3
info:
  title: HH Education API
  version: 0.1.0
  description: API documentation for the current backend implementation.
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: Authentication and token lifecycle
  - name: Users
    description: User profile and user management
  - name: Courses
    description: Course catalog and course management
  - name: Enrollments
    description: Course access grants for students
  - name: Orders
    description: Student checkout orders and admin order management
  - name: Payments
    description: Payment attempts, provider webhooks, and transaction reconciliation
  - name: Learning
    description: Authenticated student learning area
  - name: Blog
    description: Public and admin blog content management
  - name: Media
    description: Upload media files to Cloudflare R2

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register student account
      description: Register a new student account. Email verification is currently bypassed and the account is created as active.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyen Van A
              email: student@example.com
              password: Password123!
              confirmPassword: Password123!
      responses:
        '201':
          description: Student account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Email already exists. Please use a different email address.
                  details: null

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticate credentials and create a login session with access and refresh tokens.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student@example.com
              password: Password123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials. Please check your email and password and try again.
                  details: null
        '403':
          description: Account is banned or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh token
      description: Rotate refresh token and issue a new access token and refresh token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: jwt-refresh-token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid refresh token or refresh token reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value:
                    success: false
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: Invalid refresh token. Please log in again.
                      details: null
                refreshTokenReused:
                  value:
                    success: false
                    error:
                      code: REFRESH_TOKEN_REUSED
                      message: Refresh token reuse detected. Please log in again.
                      details: null
        '403':
          description: Account is banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Return the profile of the authenticated user.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeSuccessResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized. Please log in to access this resource.
                      details: null
                accessTokenExpired:
                  value:
                    success: false
                    error:
                      code: ACCESS_TOKEN_EXPIRED
                      message: Access token expired. Please refresh your session.
                      details: null
                invalidAccessToken:
                  value:
                    success: false
                    error:
                      code: INVALID_ACCESS_TOKEN
                      message: Invalid access token. Please log in again.
                      details: null
        '403':
          description: Account is banned or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Users
      summary: Update current user profile
      description: Update the authenticated user's profile. Avatar is linked by uploaded ready image media id; avatarUrl is returned as a derived public URL.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              fullName: Nguyen Van A
              avatarMediaId: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Current user profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is banned or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User profile or avatar media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/teachers:
    post:
      tags:
        - Users
      summary: Create teacher account
      description: Admin creates an active teacher account. Teacher email verification is bypassed for now.
      operationId: createTeacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherRequest'
            example:
              fullName: Teacher A
              email: teacher@example.com
              avatarMediaId: 00000000-0000-0000-0000-000000000000
              password: Password123!
              confirmPassword: Password123!
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeacherSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      tags:
        - Users
      summary: List users
      description: Admin lists users with offset pagination, optional role/status filters, and search by email or full name.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number. Offset is calculated as `(page - 1) * limit`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of users per page.
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/UserRole'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search by email or full name.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}/status:
    patch:
      tags:
        - Users
      summary: Update user status
      description: Admin updates a user's account status.
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: banned
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullDataSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/enrollments:
    post:
      tags:
        - Enrollments
      summary: Manually enroll a student in a course
      description: Admin manually grants an active student access to a published course. Payment flows must create enrollments internally and should not call this endpoint.
      operationId: createManualEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualEnrollmentRequest'
            example:
              courseId: 00000000-0000-0000-0000-000000000000
              userId: 11111111-1111-1111-1111-111111111111
              manualReason: Internal scholarship grant
      responses:
        '201':
          description: Student enrolled in course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManualEnrollmentSuccessResponse'
        '400':
          description: Validation failed, course is not published, or user is not an active student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already enrolled in this course, including duplicate requests caught by the enrollment unique constraint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: CONFLICT
                  message: User is already enrolled in this course
                  details: null

  /admin/courses:
    get:
      tags:
        - Courses
      summary: List admin courses
      description: Admin lists all non-deleted courses. Teachers list only courses assigned to them; teacherId query is ignored for teachers.
      operationId: listAdminCourses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CourseStatus'
        - in: query
          name: teacherId
          schema:
            type: string
            format: uuid
        - in: query
          name: isFeatured
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdminCoursesSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Courses
      summary: Create course draft
      description: Admin creates a draft course and assigns it to an active teacher. Teachers can create draft courses only for themselves. Slug is generated by server from title plus a short timestamp suffix.
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              title: Lap trinh C co ban
              description: Khoa hoc nhap mon lap trinh C
              subject: math
              grade: 10
              teacherId: 00000000-0000-0000-0000-000000000000
              thumbnailMediaId: 11111111-1111-1111-1111-111111111111
              price: 500000
              salePrice: 399000
              isFeatured: true
      responses:
        '201':
          description: Course draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Validation failed or teacher is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Validation failed
                      details: []
                invalidTeacher:
                  value:
                    success: false
                    error:
                      code: INVALID_COURSE_TEACHER
                      message: Teacher does not exist, is not active, or is not a teacher account.
                      details: null
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Generated course slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: COURSE_SLUG_ALREADY_EXISTS
                  message: Course slug already exists. Please use a different slug.
                  details: null

  /admin/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Get admin course detail
      description: Admin gets one non-deleted course by id. Teachers can get only courses assigned to them.
      operationId: getAdminCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Courses
      summary: Update course metadata
      description: Admin updates course metadata. Teachers can update only courses assigned to them. Thumbnail media is updated here after upload complete returns a ready media id.
      operationId: updateCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
            example:
              title: Lap trinh C co ban update
              description: Mo ta moi
              subject: physics
              grade: 11
              thumbnailMediaId: 11111111-1111-1111-1111-111111111111
              price: 500000
              salePrice: 399000
              isFeatured: true
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Validation failed, teacher is invalid, or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/publish:
    patch:
      tags:
        - Courses
      summary: Publish course
      description: Admin publishes a draft course. Publishing is blocked when any system video lesson is missing video media or has video media whose status is not ready; error details include the affected lesson titles.
      operationId: publishCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Course status does not allow publishing, or one or more system video lessons are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/archive:
    patch:
      tags:
        - Courses
      summary: Archive course
      description: Admin archives a course. Archived courses are returned unchanged.
      operationId: archiveCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/chapters:
    post:
      tags:
        - Courses
      summary: Create course chapter
      description: Admin creates a chapter at the end of a draft or published course. Teachers can create chapters only in courses assigned to them.
      operationId: createChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
            example:
              title: Chuong 1 Nhap mon
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChapterSuccessResponse'
        '400':
          description: Validation failed or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/chapters/reorder:
    patch:
      tags:
        - Courses
      summary: Reorder course chapters
      description: Admin reorders all chapters in a course. Teachers can reorder chapters only in courses assigned to them. The request must contain exactly all chapter ids in the target order.
      operationId: reorderChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderChaptersRequest'
            example:
              chapterIds:
                - 00000000-0000-0000-0000-000000000003
                - 00000000-0000-0000-0000-000000000001
                - 00000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: Chapters reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderChaptersSuccessResponse'
        '400':
          description: Validation failed, invalid reorder payload, or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/chapters/{chapterId}/lessons:
    post:
      tags:
        - Courses
      summary: Create lesson
      description: Admin creates a lesson inside a chapter. Teachers can create lessons only in courses assigned to them. Payload rules depend on lesson type.
      operationId: createLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChapterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin or owning teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chapter, assessment, or media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/lessons/{lessonId}:
    patch:
      tags:
        - Courses
      summary: Update lesson
      description: Admin updates lesson metadata only. Lesson type and type-specific fields are immutable; create a new lesson, reorder it, and delete the old lesson to change type or video/quiz configuration.
      operationId: updateLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
