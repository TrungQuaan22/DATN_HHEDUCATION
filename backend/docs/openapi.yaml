components:
  parameters:
    CourseIdPath:
      in: path
      name: courseId
      required: true
      schema:
        type: string
        format: uuid

    ChapterIdPath:
      in: path
      name: chapterId
      required: true
      schema:
        type: string
        format: uuid

    LessonIdPath:
      in: path
      name: lessonId
      required: true
      schema:
        type: string
        format: uuid

    BlogPostIdPath:
      in: path
      name: blogPostId
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Validation failed
              details:
                - location: body
                  field: email
                  message: Invalid email

  schemas:
    UserRole:
      type: string
      enum:
        - admin
        - teacher
        - student

    UserStatus:
      type: string
      enum:
        - pending_verification
        - active
        - banned

    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - confirmPassword
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Must contain uppercase, lowercase, number, and special character.
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 64

    RegisterResponseData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarMediaId:
          type: string
          format: uuid
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - student
        status:
          type: string
          enum:
            - active

    RegisterSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisterResponseData'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64

    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarMediaId:
          type: string
          format: uuid
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    LoginResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    LoginSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
