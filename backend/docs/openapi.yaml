openapi: 3.0.3
info:
  title: HH Education API
  version: 0.1.0
  description: API documentation for the current backend implementation.
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: Authentication and token lifecycle
  - name: Users
    description: User profile and user management
  - name: Courses
    description: Course catalog and course management
  - name: Media
    description: Upload media files to Cloudflare R2

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register student account
      description: Register a new student account. Email verification is currently bypassed and the account is created as active.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyen Van A
              email: student@example.com
              password: Password123!
              confirmPassword: Password123!
      responses:
        '201':
          description: Student account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Email already exists. Please use a different email address.
                  details: null

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticate credentials and create a login session with access and refresh tokens.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student@example.com
              password: Password123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials. Please check your email and password and try again.
                  details: null
        '403':
          description: Account is banned or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh token
      description: Rotate refresh token and issue a new access token and refresh token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: jwt-refresh-token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid refresh token or refresh token reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value:
                    success: false
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: Invalid refresh token. Please log in again.
                      details: null
                refreshTokenReused:
                  value:
                    success: false
                    error:
                      code: REFRESH_TOKEN_REUSED
                      message: Refresh token reuse detected. Please log in again.
                      details: null
        '403':
          description: Account is banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Return the profile of the authenticated user.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeSuccessResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized. Please log in to access this resource.
                      details: null
                accessTokenExpired:
                  value:
                    success: false
                    error:
                      code: ACCESS_TOKEN_EXPIRED
                      message: Access token expired. Please refresh your session.
                      details: null
                invalidAccessToken:
                  value:
                    success: false
                    error:
                      code: INVALID_ACCESS_TOKEN
                      message: Invalid access token. Please log in again.
                      details: null
        '403':
          description: Account is banned or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/teachers:
    post:
      tags:
        - Users
      summary: Create teacher account
      description: Admin creates an active teacher account. Teacher email verification is bypassed for now.
      operationId: createTeacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherRequest'
            example:
              fullName: Teacher A
              email: teacher@example.com
              password: Password123!
              confirmPassword: Password123!
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeacherSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      tags:
        - Users
      summary: List users
      description: Admin lists users with offset pagination, optional role/status filters, and keyword search.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number. Offset is calculated as `(page - 1) * limit`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of users per page.
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/UserRole'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - in: query
          name: keyword
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search by email or full name.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses:
    get:
      tags:
        - Courses
      summary: List admin courses
      description: Admin lists non-deleted courses with pagination, optional status/teacher filters, and keyword search.
      operationId: listAdminCourses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CourseStatus'
        - in: query
          name: teacherId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdminCoursesSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Courses
      summary: Create course draft
      description: Admin creates a draft course and assigns it to an active teacher. Slug is generated by server from title plus a short timestamp suffix.
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              title: Lap trinh C co ban
              description: Khoa hoc nhap mon lap trinh C
              subject: math
              grade: 10
              teacherId: 00000000-0000-0000-0000-000000000000
              thumbnailMediaId: 11111111-1111-1111-1111-111111111111
              price: 500000
              salePrice: 399000
              allowPreview: true
      responses:
        '201':
          description: Course draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Validation failed or teacher is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Validation failed
                      details: []
                invalidTeacher:
                  value:
                    success: false
                    error:
                      code: INVALID_COURSE_TEACHER
                      message: Teacher does not exist, is not active, or is not a teacher account.
                      details: null
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Generated course slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: COURSE_SLUG_ALREADY_EXISTS
                  message: Course slug already exists. Please use a different slug.
                  details: null

  /admin/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Get admin course detail
      description: Admin gets one non-deleted course by id.
      operationId: getAdminCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Courses
      summary: Update course metadata
      description: Admin updates course metadata. Thumbnail media is updated here after upload complete returns a ready media id.
      operationId: updateCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
            example:
              title: Lap trinh C co ban update
              description: Mo ta moi
              subject: physics
              grade: 11
              thumbnailMediaId: 11111111-1111-1111-1111-111111111111
              price: 500000
              salePrice: 399000
              allowPreview: true
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Validation failed, teacher is invalid, or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/publish:
    patch:
      tags:
        - Courses
      summary: Publish course
      description: Admin publishes a draft course. Published courses are returned unchanged.
      operationId: publishCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          description: Course status does not allow publishing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/archive:
    patch:
      tags:
        - Courses
      summary: Archive course
      description: Admin archives a course. Archived courses are returned unchanged.
      operationId: archiveCourse
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/chapters:
    post:
      tags:
        - Courses
      summary: Create course chapter
      description: Admin creates a chapter at the end of a draft or published course.
      operationId: createChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
            example:
              title: Chuong 1 Nhap mon
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChapterSuccessResponse'
        '400':
          description: Validation failed or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/courses/{courseId}/chapters/reorder:
    patch:
      tags:
        - Courses
      summary: Reorder course chapters
      description: Admin reorders all chapters in a course. The request must contain exactly all chapter ids in the target order.
      operationId: reorderChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderChaptersRequest'
            example:
              chapterIds:
                - 00000000-0000-0000-0000-000000000003
                - 00000000-0000-0000-0000-000000000001
                - 00000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: Chapters reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderChaptersSuccessResponse'
        '400':
          description: Validation failed, invalid reorder payload, or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/chapters/{chapterId}:
    patch:
      tags:
        - Courses
      summary: Update chapter
      description: Admin updates chapter metadata.
      operationId: updateChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChapterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapterRequest'
            example:
              title: Chuong 1 Co ban
      responses:
        '200':
          description: Chapter updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChapterSuccessResponse'
        '400':
          description: Validation failed or course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chapter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Courses
      summary: Delete chapter
      description: Admin deletes a chapter. Related lessons are deleted by database cascade.
      operationId: deleteChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChapterIdPath'
      responses:
        '200':
          description: Chapter deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteChapterSuccessResponse'
        '400':
          description: Course status cannot be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chapter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog/courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Public catalog endpoint. Only published, non-deleted courses are returned.
      operationId: listCatalogCourses
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Published course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogCoursesSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog/courses/{courseSlug}:
    get:
      tags:
        - Courses
      summary: Get published course detail
      description: Public course detail by slug, including ordered chapters and lessons.
      operationId: getCatalogCourse
      parameters:
        - in: path
          name: courseSlug
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '200':
          description: Published course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/uploads/presign:
    post:
      tags:
        - Media
      summary: Create presigned upload URL
      description: Admin requests a temporary PUT URL so the client can upload an image or video directly to R2.
      operationId: createPresignedUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresignedUploadRequest'
            example:
              resourceType: image
              fileName: course-thumbnail.png
              contentType: image/png
              fileSize: 336407
      responses:
        '201':
          description: Presigned upload created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePresignedUploadSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/uploads/complete:
    post:
      tags:
        - Media
      summary: Complete upload
      description: Admin confirms that a direct upload has finished. Backend checks object existence on R2 and updates media metadata.
      operationId: completeUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
            example:
              mediaId: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media or uploaded object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    CourseIdPath:
      in: path
      name: courseId
      required: true
      schema:
        type: string
        format: uuid

    ChapterIdPath:
      in: path
      name: chapterId
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Validation failed
              details:
                - location: body
                  field: email
                  message: Invalid email

  schemas:
    UserRole:
      type: string
      enum:
        - admin
        - teacher
        - student

