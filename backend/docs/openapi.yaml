            video/mp2t:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/tutor/sessions:
    get:
      tags:
        - Tutor
      summary: List tutor sessions
      description: List AI tutor sessions for the authenticated student with optional course and lesson filters.
      operationId: listTutorSessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: courseId
          schema:
            type: string
            format: uuid
        - in: query
          name: lessonId
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        '200':
          description: Tutor session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTutorSessionsSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags:
        - Tutor
      summary: Create tutor session
      description: Create a new AI tutor session for a course and optional current lesson.
      operationId: createTutorSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTutorSessionRequest'
      responses:
        '201':
          description: Tutor session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTutorSessionSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/tutor/sessions/{sessionId}:
    get:
      tags:
        - Tutor
      summary: Get tutor session detail
      description: Return a tutor session with its messages and citations.
      operationId: getTutorSessionDetail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tutor session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorSessionDetailSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/tutor/sessions/{sessionId}/messages:
    post:
      tags:
        - Tutor
      summary: Send tutor message
      description: Send a message to AI Tutor and receive a grounded answer with citations.
      operationId: sendTutorMessage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTutorMessageRequest'
      responses:
        '200':
          description: Tutor message saved with response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTutorMessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: AI service failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /learning/tutor/sessions/{sessionId}/messages/stream:
    post:
      tags:
        - Tutor
      summary: Stream tutor message
      description: Stream tutor answer and citations using Server-Sent Events.
      operationId: sendTutorMessageStream
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTutorMessageRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    CourseIdPath:
      in: path
      name: courseId
      required: true
      schema:
        type: string
        format: uuid

    ChapterIdPath:
      in: path
      name: chapterId
      required: true
      schema:
        type: string
        format: uuid

    LessonIdPath:
      in: path
      name: lessonId
      required: true
      schema:
        type: string
        format: uuid

    MaterialIdPath:
      in: path
      name: materialId
      required: true
      schema:
        type: string
        format: uuid

    BlogPostIdPath:
      in: path
      name: blogPostId
      required: true
      schema:
        type: string
        format: uuid

    OrderIdPath:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid

    TransactionIdPath:
      in: path
      name: transactionId
      required: true
      schema:
        type: string
        format: uuid

    AssessmentIdPath:
      in: path
      name: assessmentId
      required: true
      schema:
        type: string
        format: uuid

    SectionIdPath:
      in: path
      name: sectionId
      required: true
      schema:
        type: string
        format: uuid

    AssessmentItemIdPath:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        format: uuid

    PlacementIdPath:
      in: path
      name: placementId
      required: true
      schema:
        type: string
        format: uuid

    SubmissionIdPath:
      in: path
      name: submissionId
      required: true
      schema:
        type: string
        format: uuid

    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Client-generated key used to safely retry the same request.

    PageQuery:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Validation failed
              details:
                - location: body
                  field: email
                  message: Invalid email

    Unauthorized:
      description: Missing, expired, or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: The authenticated user does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum:
        - admin
        - teacher
        - student

    UserStatus:
      type: string
      enum:
        - pending_verification
        - active
        - banned

    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived

    MediaStatus:
      type: string
      enum:
        - pending_upload
        - uploaded
        - processing
        - ready
        - failed
        - deleted

    OrderStatus:
      type: string
      enum:
        - pending
        - completed
        - cancelled
        - expired

    PaymentStatus:
      type: string
      enum:
        - pending
        - success
        - failed
        - cancelled
        - late_success
        - manual_review

    PaymentProvider:
      type: string
      enum:
        - sepay
        - momo
        - vnpay

    PaymentTransactionDirection:
      type: string
      enum:
        - in
        - out

    PaymentTransactionMatchStatus:
      type: string
      enum:
        - matched
        - unmatched
        - manual_review
        - ignored

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - confirmPassword
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Must contain uppercase, lowercase, number, and special character.
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 64

    RegisterResponseData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarMediaId:
          type: string
          format: uuid
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - student
        status:
          type: string
          enum:
            - active

    RegisterSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisterResponseData'

    LoginRequest:
      type: object
      required:
