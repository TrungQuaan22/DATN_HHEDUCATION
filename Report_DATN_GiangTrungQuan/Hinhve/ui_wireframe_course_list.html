<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1366px;
      height: 768px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }
    .frame {
      width: 1366px;
      height: 768px;
      padding: 28px;
      border: 2px solid #111111;
      background: #ffffff;
    }
    .header {
      height: 54px;
      border: 2px solid #111111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 700;
    }
    .hero {
      height: 120px;
      border: 2px solid #111111;
      margin-top: 18px;
      padding: 20px;
    }
    .hero-title { height: 26px; width: 360px; border: 1.5px solid #111111; background: #eeeeee; margin-bottom: 14px; }
    .hero-line { height: 18px; width: 620px; border: 1.5px solid #111111; background: #f7f7f7; margin-bottom: 10px; }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      height: 520px;
      margin-top: 18px;
    }
    .filters, .content {
      border: 2px solid #111111;
      padding: 14px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      text-align: center;
    }
    .filter-group {
      margin-bottom: 18px;
    }
    .filter-title {
      height: 24px;
      border: 1.5px solid #111111;
      background: #eeeeee;
      margin-bottom: 8px;
    }
    .filter-option {
      height: 28px;
      border: 1.5px solid #111111;
      margin-bottom: 7px;
      background: #ffffff;
    }
    .toolbar {
      height: 48px;
      display: grid;
      grid-template-columns: 1fr 170px 140px;
      gap: 12px;
      margin-bottom: 14px;
    }
    .search, .select, .button {
      border: 1.5px solid #111111;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .card {
      height: 198px;
      border: 2px solid #111111;
      padding: 12px;
    }
    .thumb {
      height: 72px;
      border: 1.5px solid #111111;
      background:
        linear-gradient(25deg, transparent 49%, #111111 50%, transparent 51%),
        linear-gradient(-25deg, transparent 49%, #111111 50%, transparent 51%),
        #ffffff;
      margin-bottom: 12px;
    }
    .line {
      height: 15px;
      border: 1.5px solid #111111;
      background: #f7f7f7;
      margin-bottom: 8px;
    }
    .card-bottom {
      display: grid;
      grid-template-columns: 1fr 84px;
      gap: 10px;
      margin-top: 12px;
    }
    .pagination {
      height: 38px;
      border: 1.5px solid #111111;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: #eeeeee;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <span>Danh sách khóa học</span>
      <span>Nav: khóa học, blog, đăng nhập</span>
    </div>
    <section class="hero">
      <div class="hero-title"></div>
      <div class="hero-line"></div>
      <div class="hero-line" style="width: 480px;"></div>
    </section>
    <div class="layout">
      <aside class="filters">
        <h2>Bộ lọc</h2>
        <div class="filter-group">
          <div class="filter-title"></div>
          <div class="filter-option"></div>
          <div class="filter-option"></div>
          <div class="filter-option"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title"></div>
          <div class="filter-option"></div>
          <div class="filter-option"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title"></div>
          <div class="filter-option"></div>
          <div class="filter-option"></div>
        </div>
      </aside>
      <main class="content">
        <div class="toolbar">
          <div class="search">Ô tìm kiếm khóa học</div>
          <div class="select">Sắp xếp</div>
          <div class="button">Áp dụng</div>
        </div>
        <div class="grid">
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 82%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 74%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 88%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 68%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 78%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
          <div class="card">
            <div class="thumb"></div>
            <div class="line"></div>
            <div class="line" style="width: 72%;"></div>
            <div class="card-bottom"><div class="line"></div><div class="line"></div></div>
          </div>
        </div>
        <div class="pagination">Phân trang</div>
      </main>
    </div>
  </div>
</body>
</html>
